		/* Split the screen in half */
		.split {
 			height: 100%;

  			position: fixed;
  			z-index: 1;
  			top: 0;
  			overflow-x: hidden;
  			padding-top: 20px;
		}



		/* If you want the content centered horizontally and vertically */
		.centered {
  			position: absolute;
  			top: 50%;
  			left: 50%;
  			transform: translate(-50%, -50%);
  			text-align: center;
		}		
	</style>
